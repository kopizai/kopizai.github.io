<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KopizAI - Kopi仔 · 文字版</title>
<meta name="description" content="一集一招学 AI 的文字版">
<link rel="icon" href="assets/avatar.png">
<style>
:root { --bg:#FFFDF5; --fg:#1F1A38; --muted:#5E5A72; --card:#FFFFFF; --line:#ECE7D8; --accent:#EE4266; --yellow:#FFD23F; --code:#FFF6D6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16131F; --fg:#F2EFE6; --muted:#B5B0C4; --card:#211C2E; --line:#332C44; --accent:#FF6B8A; --yellow:#FFD23F; --code:#2A2338; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#16131F; --fg:#F2EFE6; --muted:#B5B0C4; --card:#211C2E; --line:#332C44; --accent:#FF6B8A; --yellow:#FFD23F; --code:#2A2338; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.75 "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif; }
.top { background: var(--yellow); border-bottom: 4px solid #1F1A38; }
.top .in, main, footer .in { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.top img { height: 52px; width: auto; display: block; }
.top a.home { color: #1F1A38; font-weight: 700; text-decoration: none; font-size: 15px; white-space: nowrap; }
main { padding-block: 28px 48px; }
h1 { font-size: 30px; line-height: 1.3; margin: 0 0 12px; text-wrap: balance; }
h2 { font-size: 22px; margin: 36px 0 10px; padding-top: 8px; border-top: 2px dashed var(--line); }
p, li { max-width: 65ch; }
strong { color: var(--fg); }
a { color: var(--accent); overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--card); }
.code { position: relative; margin: 12px 0; }
pre { background: var(--code); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; padding-right: 76px; white-space: pre-wrap; word-break: break-word; font: 15px/1.7 inherit; margin: 0; }
code { font-family: inherit; }
.copy { position: absolute; top: 10px; right: 10px; font: 700 13px inherit; border: 2px solid #1F1A38; background: var(--yellow); color: #1F1A38; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.copy:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.meta { color: var(--muted); font-size: 14px; }
.watches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 18px; }
.watch { display: inline-block; margin: 0; background: var(--accent); color: #fff; font-weight: 700; padding: 8px 18px; border-radius: 999px; text-decoration: none; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.list a { display: block; text-decoration: none; color: var(--fg); background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.list a:hover { border-color: var(--accent); }
.list .t { font-weight: 800; font-size: 18px; }
.list .s { color: var(--muted); font-size: 15px; }
.shots { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0 8px; }
.shots figure { margin: 0; flex: 1 1 200px; max-width: 280px; }
.shots img { width: 100%; height: auto; display: block; border-radius: 14px; border: 2px solid var(--line); }
.shots figcaption { font-size: 14px; color: var(--muted); text-align: center; margin-top: 4px; }
.note { color: var(--muted); font-size: 14px; margin-top: 0; }
footer { border-top: 2px solid var(--line); }
footer .in { padding-block: 18px 28px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="top"><div class="in"><a href="index.html"><img src="assets/logo.png" alt="KopizAI - Kopi仔"></a><a class="home" href="index.html">全部集数</a></div></div>
<main>
<h1>Kopi仔 的文字版</h1>

<ul class="list">

</main>
<footer><div class="in">KopizAI - Kopi仔 · 一集一招学 AI · 非官方教学，与 Anthropic 无关。界面和功能以写作当时为准。</div></footer>
<script>
document.querySelectorAll('pre').forEach(pre => {
  const wrap = document.createElement('div'); wrap.className = 'code';
  pre.parentNode.insertBefore(wrap, pre); wrap.appendChild(pre);
  const b = document.createElement('button'); b.className = 'copy'; b.type = 'button'; b.textContent = '复制';
  b.onclick = async () => {
    const t = pre.innerText.trim();
    try { await navigator.clipboard.writeText(t); b.textContent = '已复制'; }
    catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '已选中，请复制'; }
    setTimeout(() => b.textContent = '复制', 1500);
  };
  wrap.appendChild(b);
});
</script>
</body>
</html>
